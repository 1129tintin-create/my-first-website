<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNT 業務戰情室 - 全台學校導覽 (北中南排序版)</title>
    <style>
        /* --- 2026 業務戰情室風格 --- */
        body { background: #f0f2f5; font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 20px; }
        
        /* 搜尋與篩選區懸浮 */
        .control-panel {
            position: sticky; top: 0; z-index: 100;
            background: rgba(240, 242, 245, 0.98);
            backdrop-filter: blur(10px);
            padding: 10px 0 15px 0;
            max-width: 1200px; margin: 0 auto;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .search-box { 
            width: 100%; padding: 15px 25px; border-radius: 50px; border: 2px solid #fff;
            font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); outline: none; transition: 0.3s;
            box-sizing: border-box;
        }
        .search-box:focus { border-color: #2196F3; box-shadow: 0 4px 20px rgba(33, 150, 243, 0.15); }

        /* 地區篩選按鈕 */
        .filter-group { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px; }
        .filter-btn {
            padding: 8px 16px; border-radius: 20px; border: 1px solid #ddd; background: white;
            cursor: pointer; font-size: 14px; font-weight: bold; color: #555; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover { background: #f0f0f0; }
        .filter-btn.active { background: #333; color: white; border-color: #333; }
        
        /* 顏色標籤 (北部藍/中部綠/南部橘) */
        .filter-btn[data-region="North"].active { background: #2980b9; border-color: #2980b9; }
        .filter-btn[data-region="Central"].active { background: #27ae60; border-color: #27ae60; }
        .filter-btn[data-region="South"].active { background: #d35400; border-color: #d35400; }

        /* 卡片網格 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        
        .card { 
            background: white; border-radius: 12px; padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-left: 5px solid #ccc; /* 改用左側邊框區分系所 */
            display: flex; flex-direction: column; transition: transform 0.2s;
            position: relative;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .school-badge { font-size: 14px; font-weight: bold; color: #333; }
        .campus-badge { font-size: 12px; background: #eee; padding: 3px 8px; border-radius: 4px; color: #666; }
        
        /* 地區標籤 (顯示在卡片右上角) */
        .region-tag { position: absolute; top: 10px; right: 10px; font-size: 12px; color: #999; font-weight: bold; opacity: 0.5;}

        .dept { font-size: 18px; font-weight: 800; color: #222; margin: 5px 0 10px 0; line-height: 1.4; }
        
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: auto; }
        .tag { font-size: 12px; background: #E3F2FD; color: #1565C0; padding: 3px 8px; border-radius: 6px; }

        .note { 
            margin-top: 12px; background: #FFFDE7; color: #F57F17; 
            padding: 6px 10px; border-radius: 6px; font-size: 12px; 
        }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #f0f0f0; padding-top: 12px; }
        .btn { 
            flex: 1; text-align: center; padding: 8px; border-radius: 8px; 
            font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-web { background: #f0f2f5; color: #333; }
        .btn-web:hover { background: #dcdcdc; }
        .btn-rec { background: #FFF3E0; color: #E65100; }
        .btn-rec:hover { background: #FFE0B2; }

        /* 系所分類顏色 (左邊框) */
        .env { border-left-color: #4CAF50 !important; }   /* 環工: 綠 */
        .sci { border-left-color: #9C27B0 !important; }   /* 理學: 紫 */
        .elec { border-left-color: #2196F3 !important; }  /* 電資: 藍 */
        .food { border-left-color: #FF9800 !important; }  /* 生技: 橘 */
        .eng { border-left-color: #607D8B !important; }   /* 機械: 灰 */

        #loading { text-align: center; color: #999; margin-top: 50px; }
    </style>
</head>

        { s: "國立虎尾科大", d: "機械與電腦輔助工程系", u: "https://nfu.edu.tw/", c: "雲林虎尾", t: "精密機械,CNC", cat: "eng", n: "機台大戶", r: "Central" },

        { s: "崑山科大", d: "環境工程系", u: "https://ksu.edu.tw/", c: "台南永康", t: "廢水代操作", cat: "env", n: "環工強校", r: "South" },

        // === 南部 (高雄、屏東) ===
        { s: "國立中山大學", d: "材料與光電科學學系", u: "https://moe.nsysu.edu.tw/", c: "高雄鼓山", t: "半導體材料,光電", cat: "sci", n: "理工大樓", r: "South" },

        { s: "國立臺東大學", d: "應用科學系", u: "https://nttu.edu.tw/", c: "台東", t: "化學,奈米", cat: "sci", n: "", r: "East" }
    ];

    const container = document.getElementById('cardContainer');
    const loading = document.getElementById('loading');
    let currentRegion = 'All';

    window.onload = function() {
        loading.style.display = 'none';
        renderCards(staticData);
    };

    function renderCards(data) {
        container.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = `card ${item.cat}`;
            card.dataset.search = (item.s + item.d + item.t + item.cat).toLowerCase();
            
            const tagsHtml = item.t.split(',').map(t => `<span class="tag">#${t}</span>`).join('');
            const noteHtml = item.n ? `<div class="note">📝 ${item.n}</div>` : '';
            
            // 地區對應中文
            let regionLabel = "";
            if(item.r === "North") regionLabel = "北部";
            else if(item.r === "Central") regionLabel = "中部";
            else if(item.r === "South") regionLabel = "南部";
            else if(item.r === "East") regionLabel = "東部";

            card.innerHTML = `
                <div class="header-row">
                    <span class="school-badge">${item.s}</span>
                    <span class="region-tag">${regionLabel}</span>
                </div>
                <div><span class="campus-badge">📍 ${item.c}</span></div>
                <div class="dept">${item.d}</div>
                <div class="tags">${tagsHtml}</div>
                ${noteHtml}
                <div class="btn-group">
                    <a href="${item.u}" target="_blank" class="btn btn-web">🔗 官網</a>
                    <button class="btn btn-rec" onclick="openRecord('${item.s}', '${item.d}')">✍️ 紀錄</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 地區篩選功能
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            // 移除所有 active
            buttons.forEach(b => b.classList.remove('active'));
            // 加上自己 active
            btn.classList.add('active');
            
            const region = btn.dataset.region;
            currentRegion = region;
            
            // 篩選資料
            if (region === 'All') {
                renderCards(staticData);
            } else {
                const filtered = staticData.filter(item => item.r === region);
                renderCards(filtered);
            }
        });
    });

    // 搜尋功能 (支援地區篩選後的二次搜尋)
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const val = e.target.value.toLowerCase();
        
        // 先取得目前的資料集 (全部 或 某地區)
        let sourceData = staticData;
        if (currentRegion !== 'All') {
            sourceData = staticData.filter(item => item.r === currentRegion);
        }

        // 針對該資料集進行關鍵字過濾
        const filtered = sourceData.filter(item => {
            const searchStr = (item.s + item.d + item.t + item.cat).toLowerCase();
            return searchStr.includes(val);
        });
        
        renderCards(filtered);
    });

    function openRecord(school, dept) {
