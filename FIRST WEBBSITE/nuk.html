<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立高雄大學 - 系所導覽 (修正版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 高大南國綠意配色 */
            --nuk-green: #006400;      /* 高大森綠 */
            --bg-mint-white: #F5FFFA;  /* 薄荷白 */
            --pill-lime: #F0FFF0;      /* 蜜瓜綠 */
            
            /* 類別強調色 */
            --mat-green: #228B22;      /* 化材/物理/生科 - 森林綠 */
            --tech-ocean: #0077BE;     /* 電資組 - 海洋藍 */
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-mint-white);
            margin: 0; padding: 0; color: #333;
        }

        /* --- 1. 標頭區域 --- */
        .main-header {
            background: linear-gradient(135deg, var(--nuk-green), #004d00);
            padding: 35px 20px 45px;
            text-align: center;
            color: white;
            box-shadow: 0 6px 15px rgba(0,100,0,0.25);
            position: relative; overflow: hidden;
            border-bottom: 5px solid #FFD700;
        }

        .main-header h1 {
            margin: 0 0 10px 0; font-size: 2.3rem; letter-spacing: 2px; font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: fadeInDown 0.8s ease-out;
        }
        
        .sub-header {
            margin-bottom: 25px; font-size: 1.1rem; opacity: 0.95; letter-spacing: 1px;
            font-weight: 500;
            animation: fadeInDown 0.8s ease-out 0.1s backwards;
        }
        
        .header-bg-icon {
            position: absolute; bottom: -20px; right: -10px; font-size: 10rem; opacity: 0.08; color: #90EE90; transform: rotate(-10deg); pointer-events: none;
        }

        /* 官網按鈕 */
        .website-btn {
            display: inline-flex; align-items: center;
            background: white; color: var(--nuk-green);
            padding: 12px 38px; border-radius: 50px;
            text-decoration: none; font-weight: bold; font-size: 1.1rem;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .website-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); background: #F0FFF0; }
        .website-btn:active { transform: scale(0.96); }
        .website-btn i { margin-right: 10px; }

        /* --- 2. 統編與地址 --- */
        .badges-container {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        .copy-box {
            background-color: rgba(255,255,255,0.95);
            border: 2px dashed #32CD32;
            color: #006400;
            padding: 10px 25px;
            border-radius: 12px; 
            font-size: 1.1rem; font-weight: bold; font-family: monospace, sans-serif;
            cursor: pointer; display: flex; align-items: center;
            transition: all 0.2s ease; position: relative; overflow: hidden; user-select: none;
        }

        .copy-box:hover {
            background-color: white; transform: scale(1.03);
            box-shadow: 0 5px 10px rgba(0,100,0,0.2); border-color: var(--nuk-green);
        }
        
        .copy-box:active {
            background-color: var(--mat-green); color: white; border-color: var(--mat-green);
            transform: scale(0.94);
        }

        .copy-box i { margin-right: 10px; color: var(--nuk-green); }
        .copy-box:active i { color: white; }
        .copy-hint { font-size: 0.8rem; margin-left: 8px; opacity: 0.6; font-weight: normal; }

        /* --- 主要內容區 --- */
        .main-container { max-width: 1100px; margin: 50px auto; padding: 0 25px; }
        .category-group { margin-bottom: 60px; }

        /* 分類標題 */
        .cat-pill {
            background: var(--pill-lime);
            width: fit-content; margin: 0 auto 35px; padding: 15px 45px;
            border-radius: 50px; display: flex; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            position: relative; overflow: hidden;
            border: 1px solid #E0EEE0;
            animation: popIn 0.7s cubic-bezier(0.19, 1, 0.22, 1) backwards;
        }
        .cat-pill::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; }
        .nuk-mat .cat-pill::before { background: var(--mat-green); }
        .nuk-tech .cat-pill::before { background: var(--tech-ocean); }
        
        .cat-pill h2 { margin: 0; font-size: 1.5rem; color: #555; }
        .cat-pill-icon { margin-right: 15px; font-size: 1.4rem; }
        .nuk-mat .cat-pill-icon { color: var(--mat-green); }
        .nuk-tech .cat-pill-icon { color: var(--tech-ocean); }

        /* 卡片網格 */
        .dept-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; justify-content: center;
        }

        /* --- 卡片核心樣式 --- */
        .dept-card {
            background: white; border-radius: 18px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center; padding: 35px 25px; position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; text-decoration: none;
            border-bottom: 4px solid transparent;
            opacity: 0; animation: slideUpFade 0.7s ease-out forwards;
        }

        .dept-card:hover { transform: translateY(-10px); box-shadow: 0 18px 40px rgba(0,100,0,0.1); }
        .dept-card:active { transform: scale(0.95) translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); background-color: #fcfcfc; }

        .card-top-border { position: absolute; top: 0; left: 0; right: 0; height: 7px; }
        .nuk-mat .card-top-border { background: var(--mat-green); }
        .nuk-tech .card-top-border { background: var(--tech-ocean); }
        
        .nuk-mat .dept-card:hover { border-bottom-color: var(--mat-green); }
        .nuk-tech .dept-card:hover { border-bottom-color: var(--tech-ocean); }

        .dept-icon { font-size: 2.8rem; margin-bottom: 18px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dept-card:hover .dept-icon { transform: scale(1.15) rotate(-5deg); }
        
        .nuk-mat .dept-icon { color: var(--mat-green); }
        .nuk-tech .dept-icon { color: var(--tech-ocean); }

        .dept-link-title { margin: 0 0 12px 0; font-size: 1.35rem; font-weight: 700; color: #333; }
        
        .dept-loc {
            margin: 12px 0 0; font-size: 0.95rem; color: #888;
            display: flex; align-items: center;
            background: #F0FFF0; padding: 6px 14px; border-radius: 20px;
        }
        .dept-loc i { margin-right: 7px; color: #8FBC8F; }

        /* 水波紋特效 */
        .ripple {
            position: absolute; border-radius: 50%;
            transform: scale(0); animation: ripple-animation 0.7s linear; pointer-events: none;
        }
        .nuk-mat .ripple { background: rgba(34, 139, 34, 0.15); }
        .nuk-tech .ripple { background: rgba(0, 119, 190, 0.15); }
        .copy-box .ripple, .website-btn .ripple { background: rgba(0, 100, 0, 0.2); }

        @keyframes ripple-animation { to { transform: scale(3.5); opacity: 0; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="main-header">
        <i class="fas fa-tree header-bg-icon"></i>
        <h1>國立高雄大學 (NUK)</h1>
        <div class="sub-header">楠梓校區</div>
        
        <a href="https://www.nuk.edu.tw/" target="_blank" class="website-btn ripple-target">
            <i class="fas fa-university"></i> 學校官網
        </a>

        <div class="badges-container">
            <div class="copy-box ripple-target" onclick="copyText(this, '19880949')" title="點擊複製">
                <i class="fas fa-file-invoice"></i>
                <span>19880949</span>
                <span class="copy-hint">(點擊複製)</span>
            </div>
            <div class="copy-box ripple-target" onclick="copyText(this, '81148 高雄市楠梓區高雄大學路700號')" title="點擊複製">
                <i class="fas fa-map-marker-alt"></i>
                <span>81148 高雄市楠梓區高雄大學路700號</span>
                <span class="copy-hint">(點擊複製)</span>
            </div>
        </div>
    </header>

    <div class="main-container" id="main-content">
        </div>

    <script>
        // --- 高雄大學系所資料 ---
        const departments = [
            {
                category: "化學材料、物理與生科",
                icon: "fas fa-atom",
                class: "nuk-mat",
                subDepartments: [
                    { 
                        name: "化學工程及材料工程學系", 
                        link: "https://cme.nuk.edu.tw/", 
                        loc: "工學院大樓", 
                        icon: "fas fa-flask" 
                    },
                    { 
                        name: "應用物理學系", 
                        link: "https://ap.nuk.edu.tw/", 
                        loc: "理學院大樓", 
                        icon: "fas fa-microscope" 
                    },
                    { 
                        name: "生命科學系", 
                        link: "https://ls.nuk.edu.tw/", 
                        loc: "理學院大樓", 
                        icon: "fas fa-dna" 
                    }
                ]
            },
            {
                category: "電機與資訊工程",
                icon: "fas fa-microchip", 
                class: "nuk-tech",
                subDepartments: [
                    { 
                        name: "電機工程學系", 
                        link: "https://ee.nuk.edu.tw/", 
                        loc: "工學院大樓", 
                        icon: "fas fa-bolt" 
                    },
                    { 
                        name: "資訊工程學系", 
                        // 修正 2：補上 www 以確保連結正確
                        link: "https://www.csie.nuk.edu.tw/", 
                        loc: "工學院大樓", 
                        icon: "fas fa-laptop-code" 
                    }
                ]
            }
        ];

        const container = document.getElementById('main-content');
        let animationDelay = 0.2;

        departments.forEach(cat => {
            let html = `
                <section class="category-group ${cat.class}">
                    <div class="cat-pill">
                        <i class="${cat.icon} cat-pill-icon"></i>
                        <h2>${cat.category}</h2>
                    </div>
                    <div class="dept-grid">
            `;
            cat.subDepartments.forEach(dept => {
                animationDelay += 0.15;
                html += `
                        <a href="${dept.link}" target="_blank" class="dept-card ripple-target" style="animation-delay: ${animationDelay}s">
                            <div class="card-top-border"></div>
                            <i class="${dept.icon} dept-icon"></i>
                            <h3 class="dept-link-title">${dept.name}</h3>
                            <p class="dept-loc">
                                <i class="fas fa-map-pin"></i> ${dept.loc}
                            </p>
                        </a>
                `;
            });
            html += `   </div></section>`;
            container.innerHTML += html;
        });

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.ripple-target');
            if (target) { createRipple(e, target); }
        });

        function createRipple(event, element) {
            const circle = document.createElement("span");
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;
            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            
            const ripple = element.getElementsByClassName("ripple")[0];
            if (ripple) { ripple.remove(); }
            element.appendChild(circle);
        }

        function copyText(element, text) {
            navigator.clipboard.writeText(text).then(() => {
                console.log("已複製: " + text);
            });
        }
    </script>
</body>
</html>
