<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺南大學 - 雙校區精準導覽</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 府城鳳凰紅配色 (Tainan Phoenix & Brick Theme) */
            --nutn-brick-red: #B22222;  /* 府城紅磚色 (Firebrick) */
            --nutn-phoenix: #FF4500;    /* 鳳凰花橘紅 (OrangeRed) */
            --nutn-gold: #DAA520;       /* 古都金 (GoldenRod) */
            --bg-antique-white: #FAF0E6;/* 亞麻白背景 */
            
            /* 類別強調色 */
            --mat-color: #A52A2A;       /* 材料組 - 褐紅色 */
            --energy-color: #2E8B57;    /* 綠能組 - 森林綠 */
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-antique-white);
            margin: 0; padding: 0; color: #444;
        }

        /* --- 1. 標頭區域 --- */
        .main-header {
            /* 漸層紅磚背景 */
            background: linear-gradient(135deg, var(--nutn-brick-red), #800000);
            padding: 35px 20px 45px;
            text-align: center;
            color: white;
            box-shadow: 0 6px 15px rgba(178,34,34,0.3);
            position: relative; overflow: hidden;
            border-bottom: 5px solid var(--nutn-gold); /* 金色底部飾條 */
        }

        .main-header h1 {
            margin: 0 0 10px 0; font-size: 2.4rem; letter-spacing: 2px; font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 0.8s ease-out;
        }
        
        .sub-header {
            margin-bottom: 25px; font-size: 1.1rem; opacity: 0.95; letter-spacing: 1px;
            font-weight: 500; display: inline-block; padding: 5px 15px;
            background: rgba(255,255,255,0.15); border-radius: 20px;
            animation: fadeInDown 0.8s ease-out 0.1s backwards;
        }
        
        /* 背景裝飾：鳳凰花意象 */
        .header-bg-icon {
            position: absolute; top: -20px; right: -20px; font-size: 10rem; opacity: 0.1; color: #FFD700; transform: rotate(20deg); pointer-events: none;
        }

        /* 官網按鈕 */
        .website-btn {
            display: inline-flex; align-items: center;
            background: white; color: var(--nutn-brick-red);
            padding: 12px 38px; border-radius: 50px;
            text-decoration: none; font-weight: bold; font-size: 1.1rem;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .website-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); background: #FFF8DC; }
        .website-btn:active { transform: scale(0.96); }
        .website-btn i { margin-right: 10px; }

        /* --- 2. 雙校區地址 (重點區塊) --- */
        .badges-container {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        /* 府城校區 (Main) 樣式 */
        .copy-box-main {
            background-color: #FFF5EE; /* 淺紅底 */
            border: 2px dashed var(--nutn-brick-red);
            color: #8B0000;
        }
        /* 榮譽校區 (Eng) 樣式 */
        .copy-box-eng {
            background-color: #F0FFF0; /* 淺綠底 */
            border: 2px dashed #2E8B57;
            color: #006400;
        }

        .copy-box {
            padding: 12px 25px; border-radius: 12px; 
            font-size: 1.05rem; font-weight: bold; font-family: "Microsoft JhengHei", monospace;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s ease; position: relative; overflow: hidden; user-select: none;
            min-width: 280px; /* 讓兩個地址寬度一致 */
        }

        .copy-box:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .copy-box:active { transform: scale(0.96); opacity: 0.9; }

        .copy-box i { margin-bottom: 5px; font-size: 1.2rem; }
        .campus-tag { font-size: 0.85rem; margin-bottom: 3px; opacity: 0.8; }
        .copy-hint { font-size: 0.8rem; margin-top: 5px; opacity: 0.6; font-weight: normal; }


        /* --- 主要內容區 --- */
        .main-container { max-width: 1100px; margin: 50px auto; padding: 0 25px; }
        .category-group { margin-bottom: 60px; }

        /* 分類標題 */
        .cat-pill {
            background: white;
            width: fit-content; margin: 0 auto 35px; padding: 15px 45px;
            border-radius: 50px; display: flex; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
            position: relative; overflow: hidden;
            border-left: 5px solid #ccc;
            animation: popIn 0.7s cubic-bezier(0.19, 1, 0.22, 1) backwards;
        }
        .nutn-mat .cat-pill { border-left-color: var(--mat-color); }
        .nutn-eng .cat-pill { border-left-color: var(--energy-color); }
        
        .cat-pill h2 { margin: 0; font-size: 1.5rem; color: #555; }
        .cat-pill-icon { margin-right: 15px; font-size: 1.4rem; }
        .nutn-mat .cat-pill-icon { color: var(--mat-color); }
        .nutn-eng .cat-pill-icon { color: var(--energy-color); }

        /* 卡片網格 */
        .dept-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; justify-content: center;
        }

        /* --- 卡片核心樣式 --- */
        .dept-card {
            background: white; border-radius: 18px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center; padding: 35px 25px; position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; text-decoration: none;
            opacity: 0; animation: slideUpFade 0.7s ease-out forwards;
        }

        .dept-card:hover { transform: translateY(-10px); box-shadow: 0 18px 40px rgba(178,34,34,0.15); }
        .dept-card:active { transform: scale(0.95) translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); background-color: #fcfcfc; }

        .card-top-border { position: absolute; top: 0; left: 0; right: 0; height: 7px; }
        .nutn-mat .card-top-border { background: var(--mat-color); }
        .nutn-eng .card-top-border { background: var(--energy-color); }

        .dept-icon { font-size: 2.8rem; margin-bottom: 18px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dept-card:hover .dept-icon { transform: scale(1.15) rotate(10deg); }
        
        .nutn-mat .dept-icon { color: var(--mat-color); }
        .nutn-eng .dept-icon { color: var(--energy-color); }

        .dept-link-title { margin: 0 0 12px 0; font-size: 1.35rem; font-weight: 700; color: #333; }
        
        .dept-loc {
            margin: 12px 0 0; font-size: 0.95rem; color: #666;
            display: flex; align-items: center; justify-content: center;
            background: #eee; padding: 6px 14px; border-radius: 20px; width: fit-content;
        }
        /* 特殊校區標示色 */
        .loc-main { background: #FFF0F5; color: #8B0000; }
        .loc-eng { background: #F0FFF0; color: #006400; }
        
        .dept-loc i { margin-right: 7px; }

        /* 水波紋特效 */
        .ripple {
            position: absolute; border-radius: 50%;
            transform: scale(0); animation: ripple-animation 0.7s linear; pointer-events: none;
        }
        .nutn-mat .ripple { background: rgba(165, 42, 42, 0.15); }
        .nutn-eng .ripple { background: rgba(46, 139, 87, 0.15); }
        .website-btn .ripple { background: rgba(178, 34, 34, 0.2); }
        .copy-box-eng .ripple { background: rgba(46, 139, 87, 0.2); }

        @keyframes ripple-animation { to { transform: scale(3.5); opacity: 0; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="main-header">
        <i class="fas fa-feather-alt header-bg-icon"></i>
        <h1>國立臺南大學 (NUTN)</h1>
        <div class="sub-header">注意：理工系所分屬不同校區</div>
        
        <a href="https://www.nutn.edu.tw/" target="_blank" class="website-btn ripple-target">
            <i class="fas fa-university"></i> 學校官網
        </a>

        <div class="badges-container">
            <div class="copy-box copy-box-main ripple-target" onclick="copyText(this, '70005 台南市中西區樹林街二段33號')" title="點擊複製">
                <span class="campus-tag"><i class="fas fa-map-pin"></i> 府城校區 (校本部)</span>
                <span>70005 台南市中西區樹林街二段33號</span>
                <span class="copy-hint">(材料系 在此處)</span>
            </div>
            
            <div class="copy-box copy-box-eng ripple-target" onclick="copyText(this, '70101 台南市東區榮譽街67號')" title="點擊複製">
                <span class="campus-tag"><i class="fas fa-charging-station"></i> 榮譽校區 (工程)</span>
                <span>70101 台南市東區榮譽街67號</span>
                <span class="copy-hint">(綠能/電機系 在此處)</span>
            </div>
        </div>
    </header>

    <div class="main-container" id="main-content">
        </div>

    <script>
        // --- 台南大學系所資料 (已驗證地址與網址) ---
        const departments = [
            {
                category: "材料與科學 (府城校區)",
                icon: "fas fa-atom",
                class: "nutn-mat",
                subDepartments: [
                    { 
                        name: "材料科學系", 
                        // 重要：材料系在格致樓 (府城校區)
                        link: "https://material.nutn.edu.tw/", 
                        loc: "府城校區 (格致樓)", 
                        locClass: "loc-main",
                        icon: "fas fa-layer-group" 
                    }
                ]
            },
            {
                category: "綠能與工程 (榮譽校區)",
                icon: "fas fa-solar-panel",
                class: "nutn-eng",
                subDepartments: [
                    { 
                        name: "綠色能源科技學系", 
                        // 重要：綠能系在榮譽校區
                        link: "https://greenergy.nutn.edu.tw/", 
                        loc: "榮譽校區", 
                        locClass: "loc-eng",
                        icon: "fas fa-leaf" 
                    },
                    { 
                        name: "電機工程學系", 
                        // 工程科系多位於榮譽校區
                        link: "https://ee.nutn.edu.tw/", 
                        loc: "榮譽校區", 
                        locClass: "loc-eng",
                        icon: "fas fa-bolt" 
                    },
                    { 
                        name: "資訊工程學系", 
                        link: "https://csie.nutn.edu.tw/", 
                        loc: "榮譽校區", 
                        locClass: "loc-eng",
                        icon: "fas fa-laptop-code" 
                    }
                ]
            }
        ];

        const container = document.getElementById('main-content');
        let animationDelay = 0.2;

        departments.forEach(cat => {
            let html = `
                <section class="category-group ${cat.class}">
                    <div class="cat-pill">
                        <i class="${cat.icon} cat-pill-icon"></i>
                        <h2>${cat.category}</h2>
                    </div>
                    <div class="dept-grid">
            `;
            cat.subDepartments.forEach(dept => {
                animationDelay += 0.15;
                html += `
                        <a href="${dept.link}" target="_blank" class="dept-card ripple-target" style="animation-delay: ${animationDelay}s">
                            <div class="card-top-border"></div>
                            <i class="${dept.icon} dept-icon"></i>
                            <h3 class="dept-link-title">${dept.name}</h3>
                            <p class="dept-loc ${dept.locClass}">
                                <i class="fas fa-map-marker-alt"></i> ${dept.loc}
                            </p>
                        </a>
                `;
            });
            html += `   </div></section>`;
            container.innerHTML += html;
        });

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.ripple-target');
            if (target) { createRipple(e, target); }
        });

        function createRipple(event, element) {
            const circle = document.createElement("span");
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;
            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            
            const ripple = element.getElementsByClassName("ripple")[0];
            if (ripple) { ripple.remove(); }
            element.appendChild(circle);
        }

        function copyText(element, text) {
            navigator.clipboard.writeText(text).then(() => {
                console.log("已複製: " + text);
            });
        }
    </script>
</body>
</html>
