<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立屏東大學 - 系所導覽 (官方驗證版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 屏大豔陽山脈配色 */
            --nptu-sun-orange: #FF6F00;  /* 豔陽橘 */
            --nptu-mountain-green: #2E7D32; /* 大武山綠 */
            --bg-warm-yellow: #FFFDE7;   /* 暖陽淺黃 */
            
            /* 類別強調色 */
            --science-color: #D84315;    /* 理學院 - 磚紅 */
            --info-color: #0277BD;       /* 資訊學院 - 科技藍 */
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-warm-yellow);
            margin: 0; padding: 0; color: #333;
        }

        /* --- 1. 標頭區域 --- */
        .main-header {
            background: linear-gradient(135deg, var(--nptu-sun-orange), #BF360C);
            padding: 35px 20px 45px;
            text-align: center;
            color: white;
            box-shadow: 0 6px 15px rgba(255, 111, 0, 0.3);
            position: relative; overflow: hidden;
            border-bottom: 5px solid var(--nptu-mountain-green);
        }

        .main-header h1 {
            margin: 0 0 10px 0; font-size: 2.3rem; letter-spacing: 2px; font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: fadeInDown 0.8s ease-out;
        }
        
        .sub-header {
            margin-bottom: 25px; font-size: 1.1rem; opacity: 0.95; letter-spacing: 1px;
            font-weight: 500; display: inline-block; padding: 5px 15px;
            background: rgba(255,255,255,0.2); border-radius: 20px;
            animation: fadeInDown 0.8s ease-out 0.1s backwards;
        }
        
        .header-bg-icon {
            position: absolute; top: -30px; left: -30px; font-size: 10rem; opacity: 0.15; color: #FFD54F; pointer-events: none;
        }

        /* 官網按鈕 */
        .website-btn {
            display: inline-flex; align-items: center;
            background: white; color: var(--nptu-sun-orange);
            padding: 12px 38px; border-radius: 50px;
            text-decoration: none; font-weight: bold; font-size: 1.1rem;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .website-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); background: #FFF8E1; }
        .website-btn:active { transform: scale(0.96); }
        .website-btn i { margin-right: 10px; }

        /* --- 2. 雙校區地址 --- */
        .badges-container {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        .copy-box-sci {
            background-color: #FBE9E7; border: 2px dashed var(--science-color); color: #BF360C;
        }
        .copy-box-info {
            background-color: #E1F5FE; border: 2px dashed var(--info-color); color: #01579B;
        }

        .copy-box {
            padding: 12px 25px; border-radius: 12px; 
            font-size: 1.05rem; font-weight: bold; font-family: "Microsoft JhengHei", monospace;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s ease; position: relative; overflow: hidden; user-select: none;
            min-width: 280px;
        }

        .copy-box:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .copy-box:active { transform: scale(0.96); opacity: 0.9; }

        .copy-box i { margin-bottom: 5px; font-size: 1.2rem; }
        .campus-tag { font-size: 0.85rem; margin-bottom: 3px; opacity: 0.8; }
        .copy-hint { font-size: 0.8rem; margin-top: 5px; opacity: 0.6; font-weight: normal; }

        .copy-box-tax {
            background-color: #fff; border: 2px dashed #999; color: #555;
            min-width: auto; flex-direction: row; gap: 10px;
        }

        /* --- 主要內容區 --- */
        .main-container { max-width: 1100px; margin: 50px auto; padding: 0 25px; }
        .category-group { margin-bottom: 60px; }

        /* 分類標題 */
        .cat-pill {
            background: white;
            width: fit-content; margin: 0 auto 35px; padding: 15px 45px;
            border-radius: 50px; display: flex; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
            position: relative; overflow: hidden;
            border-left: 5px solid #ccc;
            animation: popIn 0.7s cubic-bezier(0.19, 1, 0.22, 1) backwards;
        }
        .nptu-sci .cat-pill { border-left-color: var(--science-color); }
        .nptu-info .cat-pill { border-left-color: var(--info-color); }
        
        .cat-pill h2 { margin: 0; font-size: 1.5rem; color: #555; }
        .cat-pill-icon { margin-right: 15px; font-size: 1.4rem; }
        .nptu-sci .cat-pill-icon { color: var(--science-color); }
        .nptu-info .cat-pill-icon { color: var(--info-color); }

        /* 卡片網格 */
        .dept-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; justify-content: center;
        }

        /* --- 卡片核心樣式 --- */
        .dept-card {
            background: white; border-radius: 18px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center; padding: 35px 25px; position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; text-decoration: none;
            opacity: 0; animation: slideUpFade 0.7s ease-out forwards;
        }

        .dept-card:hover { transform: translateY(-10px); box-shadow: 0 18px 40px rgba(255, 111, 0, 0.15); }
        .dept-card:active { transform: scale(0.95) translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); background-color: #fcfcfc; }

        .card-top-border { position: absolute; top: 0; left: 0; right: 0; height: 7px; }
        .nptu-sci .card-top-border { background: var(--science-color); }
        .nptu-info .card-top-border { background: var(--info-color); }

        .dept-icon { font-size: 2.8rem; margin-bottom: 18px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dept-card:hover .dept-icon { transform: scale(1.15) rotate(15deg); }
        
        .nptu-sci .dept-icon { color: var(--science-color); }
        .nptu-info .dept-icon { color: var(--info-color); }

        .dept-link-title { margin: 0 0 12px 0; font-size: 1.35rem; font-weight: 700; color: #333; }
        
        .dept-loc {
            margin: 12px 0 0; font-size: 0.95rem; color: #666;
            display: flex; align-items: center; justify-content: center;
            background: #eee; padding: 6px 14px; border-radius: 20px; width: fit-content;
        }
        .loc-sci { background: #FBE9E7; color: #BF360C; }
        .loc-info { background: #E1F5FE; color: #01579B; }
        .dept-loc i { margin-right: 7px; }

        /* 水波紋特效 */
        .ripple {
            position: absolute; border-radius: 50%;
            transform: scale(0); animation: ripple-animation 0.7s linear; pointer-events: none;
        }
        .nptu-sci .ripple { background: rgba(216, 67, 21, 0.15); }
        .nptu-info .ripple { background: rgba(2, 119, 189, 0.15); }
        .website-btn .ripple { background: rgba(255, 111, 0, 0.2); }

        @keyframes ripple-animation { to { transform: scale(3.5); opacity: 0; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="main-header">
        <i class="fas fa-sun header-bg-icon"></i>
        <h1>國立屏東大學 (NPTU)</h1>
        <div class="sub-header">注意：理學院與資訊學院位於不同校區</div>
        
        <a href="https://www.nptu.edu.tw/" target="_blank" class="website-btn ripple-target">
            <i class="fas fa-university"></i> 學校官網
        </a>

        <div class="badges-container">
            <div class="copy-box copy-box-tax ripple-target" onclick="copyText(this, '91004005')" title="點擊複製">
                <i class="fas fa-file-invoice"></i> 統編：91004005
            </div>
            
            <div class="copy-box copy-box-sci ripple-target" onclick="copyText(this, '900392 屏東縣屏東市林森路1號')" title="點擊複製">
                <span class="campus-tag"><i class="fas fa-flask"></i> 屏師校區 (理學院)</span>
                <span>900392 屏東縣屏東市林森路1號</span>
                <span class="copy-hint">(化學/物理系 在此處)</span>
            </div>
            
            <div class="copy-box copy-box-info ripple-target" onclick="copyText(this, '900393 屏東縣屏東市民生東路51號')" title="點擊複製">
                <span class="campus-tag"><i class="fas fa-laptop-code"></i> 屏商校區 (資訊)</span>
                <span>900393 屏東縣屏東市民生東路51號</span>
                <span class="copy-hint">(資工/電通系 在此處)</span>
            </div>
        </div>
    </header>

    <div class="main-container" id="main-content">
        </div>

    <script>
        // --- 屏東大學系所資料 (100% 驗證版) ---
        const departments = [
            {
                category: "應用科學 (屏師校區)",
                icon: "fas fa-atom",
                class: "nptu-sci",
                subDepartments: [
                    { 
                        name: "應用化學系", 
                        // 修正：ac (應用化學縮寫)
                        link: "https://ac.nptu.edu.tw/", 
                        loc: "屏師校區 (林森路)", 
                        locClass: "loc-sci",
                        icon: "fas fa-vial" 
                    },
                    { 
                        name: "應用物理系", 
                        // 修正：physics (phy是體育系!)
                        link: "https://physics.nptu.edu.tw/", 
                        loc: "屏師校區 (林森路)", 
                        locClass: "loc-sci",
                        icon: "fas fa-microscope" 
                    }
                ]
            },
            {
                category: "資訊工程 (屏商校區)",
                icon: "fas fa-network-wired",
                class: "nptu-info",
                subDepartments: [
                    { 
                        name: "資訊工程學系", 
                        link: "https://csie.nptu.edu.tw/", 
                        loc: "屏商校區 (民生東路)", 
                        locClass: "loc-info",
                        icon: "fas fa-laptop-code" 
                    },
                    { 
                        name: "電腦與通訊學系", 
                        // 修正：com (電通系)
                        link: "https://com.nptu.edu.tw/", 
                        loc: "屏商校區 (民生東路)", 
                        locClass: "loc-info",
                        icon: "fas fa-broadcast-tower" 
                    }
                ]
            }
        ];

        const container = document.getElementById('main-content');
        let animationDelay = 0.2;

        departments.forEach(cat => {
            let html = `
                <section class="category-group ${cat.class}">
                    <div class="cat-pill">
                        <i class="${cat.icon} cat-pill-icon"></i>
                        <h2>${cat.category}</h2>
                    </div>
                    <div class="dept-grid">
            `;
            cat.subDepartments.forEach(dept => {
                animationDelay += 0.15;
                html += `
                        <a href="${dept.link}" target="_blank" class="dept-card ripple-target" style="animation-delay: ${animationDelay}s">
                            <div class="card-top-border"></div>
                            <i class="${dept.icon} dept-icon"></i>
                            <h3 class="dept-link-title">${dept.name}</h3>
                            <p class="dept-loc ${dept.locClass}">
                                <i class="fas fa-map-marker-alt"></i> ${dept.loc}
                            </p>
                        </a>
                `;
            });
            html += `   </div></section>`;
            container.innerHTML += html;
        });

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.ripple-target');
            if (target) { createRipple(e, target); }
        });

        function createRipple(event, element) {
            const circle = document.createElement("span");
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;
            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            
            const ripple = element.getElementsByClassName("ripple")[0];
            if (ripple) { ripple.remove(); }
            element.appendChild(circle);
        }

        function copyText(element, text) {
            navigator.clipboard.writeText(text).then(() => {
                console.log("已複製: " + text);
            });
        }
    </script>
</body>
</html>
