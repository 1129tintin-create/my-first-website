<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立臺東大學 - 系所導覽 (官方驗證版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 臺東大學 - 後山綠色幾何配色 */
            --nttu-green: #388E3C;     /* 圖書館地景綠 */
            --nttu-sky: #0288D1;       /* 臺東藍天 */
            --bg-fresh-white: #F1F8E9; /* 清新淺綠白 */
            
            /* 類別強調色 */
            --app-sci-color: #2E7D32;  /* 應科系 - 深綠 */
            --info-color: #01579B;     /* 資訊/綠能 - 深藍 */
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-fresh-white);
            margin: 0; padding: 0; color: #333;
        }

        /* --- 1. 標頭區域 --- */
        .main-header {
            background: linear-gradient(135deg, var(--nttu-green), var(--nttu-sky));
            padding: 35px 20px 45px;
            text-align: center;
            color: white;
            box-shadow: 0 6px 15px rgba(56, 142, 60, 0.3);
            position: relative; overflow: hidden;
            border-bottom: 5px solid #C0CA33;
        }

        .main-header h1 {
            margin: 0 0 10px 0; font-size: 2.3rem; letter-spacing: 2px; font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: fadeInDown 0.8s ease-out;
        }
        
        .sub-header {
            margin-bottom: 25px; font-size: 1.1rem; opacity: 0.95; letter-spacing: 1px;
            font-weight: 500; display: inline-block; padding: 5px 15px;
            background: rgba(255,255,255,0.2); border-radius: 20px;
            animation: fadeInDown 0.8s ease-out 0.1s backwards;
        }
        
        .header-bg-icon {
            position: absolute; bottom: -10px; right: -20px; font-size: 12rem; opacity: 0.15; color: #DCEDC8; pointer-events: none;
        }

        /* 官網按鈕 */
        .website-btn {
            display: inline-flex; align-items: center;
            background: white; color: var(--nttu-green);
            padding: 12px 38px; border-radius: 50px;
            text-decoration: none; font-weight: bold; font-size: 1.1rem;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .website-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); background: #F1F8E9; }
        .website-btn:active { transform: scale(0.96); }
        .website-btn i { margin-right: 10px; }

        /* --- 2. 統編與地址 --- */
        .badges-container {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        .copy-box {
            background-color: rgba(255,255,255,0.95);
            border: 2px dashed #AED581;
            color: #1B5E20;
            padding: 10px 25px;
            border-radius: 12px; 
            font-size: 1.1rem; font-weight: bold; font-family: "Microsoft JhengHei", monospace;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s ease; position: relative; overflow: hidden; user-select: none;
            min-width: 250px;
        }

        .copy-box:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(56, 142, 60, 0.2); }
        .copy-box:active { transform: scale(0.96); opacity: 0.9; }

        .copy-box i { margin-bottom: 5px; font-size: 1.2rem; }
        .copy-hint { font-size: 0.8rem; margin-top: 5px; opacity: 0.6; font-weight: normal; }

        .copy-box-tax {
            flex-direction: row; gap: 10px; min-width: auto;
        }
        .copy-box-tax i { margin-bottom: 0; }
        .copy-box-tax .copy-hint { margin-top: 0; margin-left: 5px; }


        /* --- 主要內容區 --- */
        .main-container { max-width: 1100px; margin: 50px auto; padding: 0 25px; }
        .category-group { margin-bottom: 60px; }

        /* 分類標題 */
        .cat-pill {
            background: white;
            width: fit-content; margin: 0 auto 35px; padding: 15px 45px;
            border-radius: 50px; display: flex; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
            position: relative; overflow: hidden;
            border-left: 5px solid #ccc;
            animation: popIn 0.7s cubic-bezier(0.19, 1, 0.22, 1) backwards;
        }
        .nttu-sci .cat-pill { border-left-color: var(--app-sci-color); }
        .nttu-info .cat-pill { border-left-color: var(--info-color); }
        
        .cat-pill h2 { margin: 0; font-size: 1.5rem; color: #555; }
        .cat-pill-icon { margin-right: 15px; font-size: 1.4rem; }
        .nttu-sci .cat-pill-icon { color: var(--app-sci-color); }
        .nttu-info .cat-pill-icon { color: var(--info-color); }

        /* 卡片網格 */
        .dept-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; justify-content: center;
        }

        /* --- 卡片核心樣式 --- */
        .dept-card {
            background: white; border-radius: 18px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center; padding: 35px 25px; position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; text-decoration: none;
            opacity: 0; animation: slideUpFade 0.7s ease-out forwards;
        }

        .dept-card:hover { transform: translateY(-10px); box-shadow: 0 18px 40px rgba(56, 142, 60, 0.15); }
        .dept-card:active { transform: scale(0.95) translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); background-color: #fcfcfc; }

        .card-top-border { position: absolute; top: 0; left: 0; right: 0; height: 7px; }
        .nttu-sci .card-top-border { background: var(--app-sci-color); }
        .nttu-info .card-top-border { background: var(--info-color); }

        .dept-icon { font-size: 2.8rem; margin-bottom: 18px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dept-card:hover .dept-icon { transform: scale(1.15); }
        
        .nttu-sci .dept-icon { color: var(--app-sci-color); }
        .nttu-info .dept-icon { color: var(--info-color); }

        .dept-link-title { margin: 0 0 12px 0; font-size: 1.35rem; font-weight: 700; color: #333; }
        
        .dept-loc {
            margin: 12px 0 0; font-size: 0.95rem; color: #666;
            display: flex; align-items: center; justify-content: center;
            background: #eee; padding: 6px 14px; border-radius: 20px; width: fit-content;
        }
        .dept-loc i { margin-right: 7px; color: #388E3C; }

        /* 水波紋特效 */
        .ripple {
            position: absolute; border-radius: 50%;
            transform: scale(0); animation: ripple-animation 0.7s linear; pointer-events: none;
        }
        .nttu-sci .ripple { background: rgba(46, 125, 50, 0.15); }
        .nttu-info .ripple { background: rgba(1, 87, 155, 0.15); }
        .website-btn .ripple, .copy-box .ripple { background: rgba(56, 142, 60, 0.2); }

        @keyframes ripple-animation { to { transform: scale(3.5); opacity: 0; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="main-header">
        <i class="fas fa-mountain header-bg-icon"></i>
        <h1>國立臺東大學 (NTTU)</h1>
        <div class="sub-header">知本校區 (理工學院)</div>
        
        <a href="https://wcse.nttu.edu.tw/" target="_blank" class="website-btn ripple-target">
            <i class="fas fa-university"></i> 理工學院官網 (系所總表)
        </a>

        <div class="badges-container">
            <div class="copy-box copy-box-tax ripple-target" onclick="copyText(this, '93005300')" title="點擊複製">
                <i class="fas fa-file-invoice"></i>
                <span>統編：93005300</span>
            </div>
            
            <div class="copy-box ripple-target" onclick="copyText(this, '95092 臺東市大學路二段369號')" title="點擊複製">
                <i class="fas fa-map-marker-alt"></i>
                <span>95092 臺東市大學路二段369號</span>
                <span class="copy-hint">(點擊複製)</span>
            </div>
        </div>
    </header>

    <div class="main-container" id="main-content">
        </div>

    <script>
        // --- 臺東大學系所資料 (2026 實測驗證版) ---
        const departments = [
            {
                category: "應用科學 (物理/化學/材料)",
                icon: "fas fa-flask",
                class: "nttu-sci",
                subDepartments: [
                    { 
                        name: "應用科學系", 
                        // 修正：使用 se (Science & Engineering)
                        link: "https://se.nttu.edu.tw/", 
                        loc: "理工學院A棟", 
                        icon: "fas fa-atom" 
                    }
                ]
            },
            {
                category: "綠色能源與資訊",
                icon: "fas fa-leaf",
                class: "nttu-info",
                subDepartments: [
                    { 
                        name: "資訊工程學系", 
                        // 修正：使用 wcsie
                        link: "https://wcsie.nttu.edu.tw/", 
                        loc: "理工學院C棟", 
                        icon: "fas fa-laptop-code" 
                    },
                    { 
                        name: "綠色與資訊科技學位學程", 
                        link: "https://git.nttu.edu.tw/", 
                        loc: "理工學院", 
                        icon: "fas fa-solar-panel" 
                    }
                ]
            }
        ];

        const container = document.getElementById('main-content');
        let animationDelay = 0.2;

        departments.forEach(cat => {
            let html = `
                <section class="category-group ${cat.class}">
                    <div class="cat-pill">
                        <i class="${cat.icon} cat-pill-icon"></i>
                        <h2>${cat.category}</h2>
                    </div>
                    <div class="dept-grid">
            `;
            cat.subDepartments.forEach(dept => {
                animationDelay += 0.15;
                html += `
                        <a href="${dept.link}" target="_blank" class="dept-card ripple-target" style="animation-delay: ${animationDelay}s">
                            <div class="card-top-border"></div>
                            <i class="${dept.icon} dept-icon"></i>
                            <h3 class="dept-link-title">${dept.name}</h3>
                            <p class="dept-loc">
                                <i class="fas fa-map-pin"></i> ${dept.loc}
                            </p>
                        </a>
                `;
            });
            html += `   </div></section>`;
            container.innerHTML += html;
        });

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.ripple-target');
            if (target) { createRipple(e, target); }
        });

        function createRipple(event, element) {
            const circle = document.createElement("span");
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;
            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            
            const ripple = element.getElementsByClassName("ripple")[0];
            if (ripple) { ripple.remove(); }
            element.appendChild(circle);
        }

        function copyText(element, text) {
            navigator.clipboard.writeText(text).then(() => {
                console.log("已複製: " + text);
            });
        }
    </script>
</body>
</html>
